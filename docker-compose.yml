services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: applai
      POSTGRES_PASSWORD: applai
      POSTGRES_DB: applai
    ports:
      - "5433:5432"
    volumes:
      - applai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U applai -d applai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  applai_postgres_data:
